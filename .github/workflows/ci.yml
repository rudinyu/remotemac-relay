name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    # Pinned: ubuntu-latest (26.04) has no Python 3.8 build, which the README still supports.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install mss Pillow pynput pytest cryptography

      - name: Run tests
        run: python -m pytest tests/ -v

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install interoperability dependency
        run: python -m pip install cryptography
      - name: Test native viewer and Python interoperability
        run: |
          cd mac-native
          swift test
          ./interop-test.sh

  windows-tun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Test Windows TUN and DNS helpers without changing OS settings
        run: python -m pytest tests/test_wintun.py tests/test_tun.py tests/test_windns.py -v
